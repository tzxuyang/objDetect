[project]
name = "object_detection"
version = "0.0.0"
description = "YOLO object detection and status classifier"
requires-python = ">=3.10,<3.11"

# Minimal, safe runtime dependencies for inference/training. Add heavy or system packages to non-pip-requirements.txt
dependencies = [
  "transformers",
  "numpy",
  "opencv-python",
  "Pillow",
  "matplotlib",
  "scipy",
  "scikit-learn",
  "requests>=2.34.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
